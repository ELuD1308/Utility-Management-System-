spring.datasource.url=jdbc:mysql://localhost:3306/utility_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.security.user.name=admin
spring.security.user.password=1234567890

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Use an environment variable or secret manager for JWT secret
# JWT Configuration (Matches your JwtUtils @Value annotations perfectly)
app.jwt.secret=${APP_JWT_SECRET:SuperSecretSigningKeyForUtilityBackend2026!}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Server
SERVER_PORT=${SERVER_PORT:8080}